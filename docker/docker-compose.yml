# From the repo root: docker compose -f docker/docker-compose.yml up --build
# Open http://localhost:8501. The API database is SQLite, kept in the volume "vwdb".
# Offline demo without the API: USE_MOCKS=true docker compose -f docker/docker-compose.yml up --build frontend
services:
  api:
    build: {context: .., dockerfile: docker/Dockerfile.api}
    volumes: ["vwdb:/db"]
    ports: ["8000:8000"]
  frontend:
    build: {context: .., dockerfile: docker/Dockerfile.frontend}
    environment:
      USE_MOCKS: ${USE_MOCKS:-false}
      API_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    ports: ["8501:8501"]
volumes:
  vwdb:
